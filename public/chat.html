<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Understory | Chat</title>

  <link rel="stylesheet" href="./styles.css" />
  <script src="https://kit.fontawesome.com/bd587e2beb.js" crossorigin="anonymous"></script>

  <!-- Twilio Conversations SDK -->
  <script src="https://sdk.twilio.com/js/conversations/v2.6/twilio-conversations.min.js"></script>

  <script type="module">
    /* ---------------- FIREBASE SETUP ---------------- */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAps2Jve2RE3InZyo_q9MTJ0JtKffDNe1E",
      authDomain: "understorychat.firebaseapp.com",
      projectId: "understorychat",
      storageBucket: "understorychat.firebasestorage.app",
      messagingSenderId: "1037413097995",
      appId: "1:1037413097995:web:ddde8b7775db96650e9d0e",
      measurementId: "G-T4SCFB2SZ5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let conversationsClient = null;
    let activeConversation = null;
    let currentIdentity = null;
    let isConversationReady = false;

    const CONVERSATION_NAME = "understory-global-chat";

    function appendMessage(type, author, body) {
      const msgBox = document.getElementById("messages");
      const div = document.createElement("div");
      div.classList.add("msg");

      if (type === "system") div.classList.add("system");
      if (author === currentIdentity) div.classList.add("me");

      div.innerHTML = type === "system"
        ? `<div class="body">${body}</div>`
        : `<div class="author">${author}</div><div class="body">${body}</div>`;

      msgBox.appendChild(div);
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    function prependMessages(messages) {
      const container = document.getElementById("messages");
      const fragment = document.createDocumentFragment();

      messages.forEach(msg => {
        const div = document.createElement("div");
        div.classList.add("msg");
        if (msg.author === currentIdentity) div.classList.add("me");

        div.innerHTML = `
          <div class="author">${msg.author}</div>
          <div class="body">${msg.body}</div>
        `;
        fragment.appendChild(div);
      });

      container.appendChild(fragment);
      container.scrollTop = container.scrollHeight;
    }

    async function getTwilioToken(identity) {
      const res = await fetch("/twilio-token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ identity })
      });

      if (!res.ok) throw new Error("Kunne ikke hente Twilio-token");
      return res.json();
    }

    async function loadExistingMessages(convo) {
      try {
        const page = await convo.getMessages(50);
        const items = page.items.sort((a, b) => a.index - b.index);
        prependMessages(items);
      } catch (_) {
        appendMessage("system", "", "Kunne ikke hente tidligere beskeder.");
      }
    }

    async function setupConversation() {
      if (isConversationReady) return;

      try {
        const convo = await conversationsClient.getConversationByUniqueName(CONVERSATION_NAME);

        activeConversation = convo;
        isConversationReady = true;

        await loadExistingMessages(convo);

        try { await convo.join(); } catch (_) {}

        convo.on("messageAdded", msg => {
          appendMessage("chat", msg.author, msg.body);
        });

        appendMessage("system", "", "Du er nu joined i chatten.");
      } catch (err) {
        appendMessage("system", "", "Fejl: " + err.message);
      }
    }

    async function initTwilioForIdentity(identity) {
      currentIdentity = identity;
      appendMessage("system", "", "Forbinder til Twilio...");

      const { token } = await getTwilioToken(identity);

      conversationsClient = new Twilio.Conversations.Client(token);

      conversationsClient.on("connectionStateChanged", state => {
        if (state === "connected") {
          appendMessage("system", "", "Twilio er forbundet. Indlæser chat…");
          setupConversation();
        }
      });
    }

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (!text) return;

      if (!activeConversation) {
        appendMessage("system", "", "Chatten er ikke klar endnu.");
        return;
      }

      await activeConversation.sendMessage(text);
      input.value = "";
    }

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("sendBtn").onclick = sendMessage;

      document.getElementById("messageInput").addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          sendMessage();
        }
      });

      document.getElementById("logoutBtn").addEventListener("click", async () => {
        await auth.signOut();
        window.location.href = "index.html";
      });
    });

    onAuthStateChanged(auth, user => {
      if (!user) return (window.location.href = "index.html");

      const identity = user.email;
      document.getElementById("userInfo").textContent = "Logget ind som: " + identity;

      initTwilioForIdentity(identity);
    });
  </script>
</head>

<body class="salg">
  <!-- BURGER -->
  <button class="menu-toggle" id="menuToggle">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="home-layout">
    <!-- SIDEBAR -->
    <section class="menu">
      <header class="overskrift">
<h2 style="margin-left: 37px;">Understory</h2>
      </header>

      <nav class="menu-links">
        <h3 onclick="location.href='home.html'"><i class="fa-regular fa-house"></i> Home</h3>
        <h3 onclick="location.href='calender.html'"><i class="fa-regular fa-calendar"></i> Kalender</h3>
        <h3 onclick="location.href='oplevelser.html'"><i class="fa-solid fa-ticket"></i> Oplevelser</h3>
        <h3 onclick="location.href='sales.html'"><i class="fa-solid fa-receipt"></i> Salg</h3>
        <h3 onclick="location.href='storefront.html'"><i class="fa-solid fa-store"></i> Storefront</h3>
        <h3 class="active" onclick="location.href='chat.html'"><i class="fa-regular fa-comments"></i> Chat</h3>
      </nav>

      <button id="logoutBtn" class="btn secondary logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i> Log ud
      </button>
    </section>

    <!-- CHAT MAIN -->
    <main style="flex:1;">
      <div class="chat-wrapper">
        <div class="chat-header">
          <h2>Understory chat</h2>
          <span id="userInfo" style="font-size:12px; color:#9ca3af;"></span>
        </div>

        <div id="messages" class="chat-messages"></div>

        <div class="chat-input-row">
          <input id="messageInput" placeholder="Skriv en besked..." />
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </main>
  </div>

  <!-- BURGER SCRIPT -->
  <script>
    const menu = document.querySelector('.menu');
    const toggle = document.getElementById('menuToggle');
    if (menu && toggle) {
      toggle.addEventListener('click', () => {
        menu.classList.toggle('collapsed');
        document.body.classList.toggle('menu-collapsed');
      });
    }
  </script>
</body>
</html>
