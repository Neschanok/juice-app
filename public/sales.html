<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salg</title>
    <link rel="stylesheet" href="./styles.css"/>
    <script src="https://kit.fontawesome.com/bd587e2beb.js" crossorigin="anonymous"></script>
</head>
<body class="salg">

<button class="menu-toggle" id="menuToggle">
  <i class="fa-solid fa-bars"></i>
</button>

<div class="home-layout">
    <section class="menu">
        <header class="overskrift">
<h2 style="margin-left: 37px;">Understory</h2>
        </header>

        <nav class="menu-links">
          <h3 onclick="location.href='home.html'"><i class="fa-regular fa-house"></i> Home</h3>
          <h3 onclick="location.href='calender.html'"><i class="fa-regular fa-calendar"></i> Kalender</h3>
          <h3 onclick="location.href='oplevelser.html'"><i class="fa-solid fa-ticket"></i> Oplevelser</h3>
          <h3 class="active" onclick="location.href='sales.html'"><i class="fa-solid fa-receipt"></i> Salg</h3>
          <h3 onclick="location.href='storefront.html'"><i class="fa-solid fa-store"></i> Storefront</h3>
          <h3 onclick="location.href='chat.html'"><i class="fa-regular fa-comments"></i> Chat</h3>
        </nav>

        <button id="logoutBtn" class="btn secondary logout-btn">
          <i class="fa-solid fa-right-from-bracket"></i> Log ud
        </button>
    </section>

    <main class="indhold">
        <div class="indholdoverskrift">
            <h2>Salg</h2>
        </div>

        <section>
            <div class="salg-container">
                <div class="tekst-salg">
                    <div class="salg-tal">
                        <p class="beløb">142,754</p>
                        <p>DKK</p>
                    </div>
                    <p class="periode">Salg de sidste 7 dage</p>
                    <div class="salg-detaljer">
                        <ul>
                            <li><i class="fa-solid fa-circle-plus"></i>Bruttosalg&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;175,948 DKK</li>
                            <li><i class="fa-solid fa-circle-minus"></i>Afslag&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;32 DKK</li>
                            <li><i class="fa-solid fa-repeat"></i> Refusioner&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;3,428 DKK</li>
                            <li><i class="fa-solid fa-credit-card"></i> Nettosalg&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 139,32 DKK</li>
                        </ul>
                    </div>
                </div>
                <div class="salg_graf">
                    <img src="billeder/grafforsalg.png" alt="Billede af graf over de sidste 7 dage">
                </div>
            </div>
        </section>
    </main>
</div>

<!-- BURGER SCRIPT -->
<script>
  const menu = document.querySelector('.menu');
  const toggle = document.getElementById('menuToggle');
  if (menu && toggle) {
    toggle.addEventListener('click', () => {
      menu.classList.toggle('collapsed');
      document.body.classList.toggle('menu-collapsed');
    });
  }
</script>

<!-- FIREBASE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAps2Jve2RE3InZyo_q9MTJ0JtKffDNe1E",
      authDomain: "understorychat.firebaseapp.com",
      projectId: "understorychat",
      storageBucket: "understorychat.firebasestorage.app",
      messagingSenderId: "1037413097995",
      appId: "1:1037413097995:web:ddde8b7775db96650e9d0e",
      measurementId: "G-T4SCFB2SZ5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "./index.html";
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "./index.html";
    });
</script>
</body>
</html>
