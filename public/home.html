<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Understory | Home</title>

  <link rel="stylesheet" href="./styles.css" />
  <script src="https://kit.fontawesome.com/bd587e2beb.js" crossorigin="anonymous"></script>
</head>

<body class="salg">
  <div class="home-layout">
    <!-- 🟢 Navigation bar (fra din kollega + Chat tilføjet) -->
    <section class="menu">
      <header class="overskrift">
        <h2>Understory</h2>
      </header>

      <nav class="menu-links">
        <h3><i class="fa-regular fa-house"></i> Home</h3>
        <h3><i class="fa-regular fa-calendar"></i> Kalender</h3>
        <h3><i class="fa-solid fa-ticket"></i> Oplevelser</h3>
        <h3><i class="fa-solid fa-receipt"></i> Salg</h3>
        <h3><i class="fa-solid fa-store"></i> Hjemmeside</h3>
        <h3><i class="fa-solid fa-chart-line"></i> Udvikling</h3>
        <h3><i class="fa-regular fa-comments"></i> Chat</h3>
      </nav>

      <button id="logoutBtn" class="btn secondary logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i> Log ud
      </button>
    </section>

    <!-- 🟢 Hovedindhold -->
    <main class="home-content">
      <h1>Velkommen!</h1>
      <p>Du er logget ind. Dette er Understorys interne dashboard.</p>
    </main>
  </div>

  <!-- Firebase logout -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";

    const firebaseConfig = {
     apiKey: "AIzaSyAps2Jve2RE3InZyo_q9MTJ0JtKffDNe1E",
    authDomain: "understorychat.firebaseapp.com",
    projectId: "understorychat",
    storageBucket: "understorychat.firebasestorage.app",
    messagingSenderId: "1037413097995",
    appId: "1:1037413097995:web:ddde8b7775db96650e9d0e",
    measurementId: "G-T4SCFB2SZ5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Hvis ikke logget ind → tilbage til index.html
    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "./index.html";
    });

    // Log ud
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "./index.html";
    });
  </script>
</body>
</html>
