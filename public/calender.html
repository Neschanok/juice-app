<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalender</title>
    <link rel="stylesheet" href="./styles.css"/>
    <script src="https://kit.fontawesome.com/bd587e2beb.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="salg">
    <button class="menu-toggle" id="menuToggle">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="container">
        <section class="menu">
            <header class="overskrift-logo">
                <img src="C:\Users\Bruger\Desktop\5. semester\DIS\disProject\jui...p\public\billeder\understorylogo.png" alt="Logo for Understory">
            </header>
            <nav>
                <ul>
                    <li><a href="home.html"><i class="fa-regular fa-house"></i> Home</a></li>
                    <li><a href="calender.html"><i class="fa-regular fa-calendar"></i> Kalender</a></li>
                    <li><a href="oplevelser.html"><i class="fa-solid fa-ticket"></i> Oplevelser</a></li>
                    <li><a href="sales.html"><i class="fa-solid fa-receipt"></i> Salg</a></li>
                    <li><i class="fa-solid fa-store"></i> Hjemmeside</li>
                    <li><i class="fa-solid fa-chart-line"></i> Udvikling</li>
                </ul>
            </nav>
        </section>
        <div class="kalender-container">
            <div class="left">
                <div class="kalender">
                    <div class="måned">
                        <i class="fa fa-angle-left prev"></i>
                        <div class="date"></div>
                        <i class="fa fa-angle-right next"></i>
                    </div>
                    <div class="ugedage">
                        <div>man</div>                       
                        <div>tir</div>
                        <div>ons</div>
                        <div>tor</div>
                        <div>fre</div>
                        <div>lør</div>
                        <div>søn</div>
                    </div>
                    <div class="dage"></div>
                    <div class="goto-idag">
                        <div class="goto">
                            <input type="text" placeholder="mm/yyyy" class="date-input">
                            <button class="goto-btn">go</button>
                        </div>
                        <button class="idag-btn">I dag</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="kalender.js" defer></script>
    <script>
        const menu = document.querySelector('.menu');
        const toggle = document.getElementById('menuToggle');
        if (menu && toggle) {
          toggle.addEventListener('click', () => {
            menu.classList.toggle('collapsed');
            document.body.classList.toggle('menu-collapsed');
          });
        }
    </script>

</body>
</html>
