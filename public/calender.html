<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalender</title>
    <link rel="stylesheet" href="./styles.css"/>
    <script src="https://kit.fontawesome.com/bd587e2beb.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="salg">
    <button class="menu-toggle" id="menuToggle">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="container">
        <section class="menu">
            <header class="overskrift-logo">
                <img src="billeder\understorylogo.png" alt="Logo for Understory">
            </header>
            <nav>
                <ul>
                    <li><a href="home.html"><i class="fa-regular fa-house"></i> Home</a></li>
                    <li><a href="calender.html"><i class="fa-regular fa-calendar"></i> Kalender</a></li>
                    <li><a href="oplevelser.html"><i class="fa-solid fa-ticket"></i> Oplevelser</a></li>
                    <li><a href="sales.html"><i class="fa-solid fa-receipt"></i> Salg</a></li>
                    <li><i class="fa-solid fa-store"></i> Hjemmeside</li>
                    <li><i class="fa-solid fa-chart-line"></i> Udvikling</li>
                </ul>
            </nav>
        </section>
        <div class="kalender-container">
            <div class="left">
                <div class="kalender">
                    <div class="måned">
                        <i class="fa fa-angle-left prev"></i>
                        <div class="date"></div>
                        <i class="fa fa-angle-right next"></i>
                    </div>
                    <div class="ugedage">
                        <div>man</div>                       
                        <div>tir</div>
                        <div>ons</div>
                        <div>tor</div>
                        <div>fre</div>
                        <div>lør</div>
                        <div>søn</div>
                    </div>
                    <div class="dage"></div>
                    <div class="goto-idag">
                        <div class="goto">
                            <input type="text" placeholder="mm/yyyy" class="date-input">
                            <button class="goto-btn">Gå til valgt dato</button>
                        </div>

                        <button class="idag-btn">Gå til dato dag</button>
                    </div>
                </div>
            </div>
            <div class="right">
                <div class="today-date">
                    <div class="event-dag">Tor</div>
                    <div class="event-date">27 November 2025</div>
                </div>
                <div class="events"></div>
                <div class="add-event-wrapper">
                    <div class="add-event-header">
                        <div class="title">Tilføj nyt event</div>
                        <i class="fas fa-times close"></i>
                    </div>
                    <div class="add-event-body">
                        <div class="add-event-input">
                            <input
                                type = "text"
                                placeholder="Titel på event"
                                class="event-name"
                            />
                        </div>
                        <div class="add-event-input">
                            <input
                                type="text"
                                placeholder="Starttid (hh:mm)"
                                class="event-time-from"
                            />
                        </div>
                        <div class="add-event-input">
                            <input
                                type = "text"
                                placeholder="Sluttid (hh:mm)"
                                class="event-time-to"
                            />
                        </div>
                    </div>
                    <div class="add-event-folder">
                        <button class="add-event-btn">Opret</button>
                    </div>
                </div>
                <button class="add-event">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </div>
        <script src="kalender.js" defer></script>
        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";

        const firebaseConfig = {
    apiKey: "AIzaSyAps2Jve2RE3InZyo_q9MTJ0JtKffDNe1E",
        authDomain: "understorychat.firebaseapp.com",
        projectId: "understorychat",
        storageBucket: "understorychat.firebasestorage.app",
        messagingSenderId: "1037413097995",
        appId: "1:1037413097995:web:ddde8b7775db96650e9d0e",
        measurementId: "G-T4SCFB2SZ5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Hvis ikke logget ind → tilbage til index.html
        onAuthStateChanged(auth, (user) => {
        if (!user) window.location.href = "./index.html";
        });

        // Log ud
        document.getElementById("logoutBtn").addEventListener("click", async () => {
        await signOut(auth);
        window.location.href = "./index.html";
        });
        </script>
    </body>
</html>
