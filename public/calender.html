<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Understory | Kalender</title>

    <link rel="stylesheet" href="./styles.css"/>
    <script src="https://kit.fontawesome.com/bd587e2beb.js" crossorigin="anonymous"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body class="salg">
  <!-- BURGER -->
  <button class="menu-toggle" id="menuToggle">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="container">
    <!-- SIDEBAR (samme som på home) -->
    <section class="menu">
      <header class="overskrift">
<h2 style="margin-left: 37px;">Understory</h2>
      </header>

      <nav class="menu-links">
        <h3 onclick="location.href='home.html'">
          <i class="fa-regular fa-house"></i> Home
        </h3>
        <h3 class="active" onclick="location.href='calender.html'">
          <i class="fa-regular fa-calendar"></i> Kalender
        </h3>
        <h3 onclick="location.href='oplevelser.html'">
          <i class="fa-solid fa-ticket"></i> Oplevelser
        </h3>
        <h3 onclick="location.href='sales.html'">
          <i class="fa-solid fa-receipt"></i> Salg
        </h3>
        <h3 onclick="location.href='storefront.html'">
          <i class="fa-solid fa-store"></i> Storefront
        </h3>
        <h3 onclick="location.href='chat.html'">
          <i class="fa-regular fa-comments"></i> Chat
        </h3>
      </nav>

      <button id="logoutBtn" class="btn secondary logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i> Log ud
      </button>
    </section>

    <!-- KALENDER-INDHOLD -->
    <div class="kalender-container">
      <div class="left">
        <div class="kalender">
          <div class="måned">
            <i class="fa fa-angle-left prev"></i>
            <div class="date"></div>
            <i class="fa fa-angle-right next"></i>
          </div>

          <div class="ugedage">
            <div>man</div>
            <div>tir</div>
            <div>ons</div>
            <div>tor</div>
            <div>fre</div>
            <div>lør</div>
            <div>søn</div>
          </div>

          <div class="dage"></div>

          <div class="goto-idag">
            <div class="goto">
              <input type="text" placeholder="mm/yyyy" class="date-input">
              <button class="goto-btn">Gå til valgt dato</button>
            </div>
            <button class="idag-btn">Gå til dags dato</button>
          </div>
        </div>
      </div>

      <div class="right">
        <div class="today-date">
          <div class="event-dag">Tor</div>
          <div class="event-date">27 November 2025</div>
        </div>

        <div class="events">
          <div class="no-event">Ingen events i dag.</div>
        </div>

        <div class="add-event-wrapper">
          <div class="add-event-header">
            <div class="title">Tilføj nyt event</div>
            <i class="fas fa-times close"></i>
          </div>
          <div class="add-event-body">
            <div class="add-event-input">
              <input
                type="text"
                placeholder="Titel på event"
                class="event-name"
              />
            </div>
            <div class="add-event-input">
              <input
                type="text"
                placeholder="Starttid (hh:mm)"
                class="event-time-from"
              />
            </div>
            <div class="add-event-input">
              <input
                type="text"
                placeholder="Sluttid (hh:mm)"
                class="event-time-to"
              />
            </div>
          </div>
          <div class="add-event-folder">
            <button class="add-event-btn">Opret</button>
          </div>
        </div>

        <button class="add-event">
          <i class="fas fa-plus"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- SIDEBAR TOGGLE -->
  <script>
    const menu = document.querySelector('.menu');
    const toggle = document.getElementById('menuToggle');

    if (menu && toggle) {
      toggle.addEventListener('click', () => {
        menu.classList.toggle('collapsed');
        document.body.classList.toggle('menu-collapsed');
      });
    }
  </script>

  <!-- KALENDER LOGIK -->
  <script src="kalender.js" defer></script>

  <!-- FIREBASE AUTH -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAps2Jve2RE3InZyo_q9MTJ0JtKffDNe1E",
      authDomain: "understorychat.firebaseapp.com",
      projectId: "understorychat",
      storageBucket: "understorychat.firebasestorage.app",
      messagingSenderId: "1037413097995",
      appId: "1:1037413097995:web:ddde8b7775db96650e9d0e",
      measurementId: "G-T4SCFB2SZ5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "./index.html";
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "./index.html";
    });
  </script>
</body>
</html>
